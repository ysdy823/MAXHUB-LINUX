name: Build and Push Docker Image

# IMPORTANT: After the first successful run, the ghcr.io package defaults to PRIVATE.
# You must manually set it to public:
#   GitHub → Packages → maxhub-dongle → Package settings → Change visibility → Public
# Without this, `docker pull` will fail for all users with "unauthorized".

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maxhub-dongle:latest
